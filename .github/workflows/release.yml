name: release

# tag 一推就发版：跑测试 → npm pack → 用 docs/releases/<tag>.md 建 Release 并上传 tarball。
# GITHUB_TOKEN 自带 contents: write，无需额外 secret。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm test

      # tag 与 package.json 版本不一致会发出错版本的 tarball，宁可在这里断。
      - name: 校验版本一致性
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $PKG 不一致"
            exit 1
          fi

      # notes 缺失时直接失败：静默回退到自动生成的 commit 列表会丢手写内容。
      - name: 校验 release notes
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::缺少 $NOTES，请先随代码提交该版本的 release notes"
            exit 1
          fi

      - name: 打包
        id: pack
        run: echo "tgz=$(npm pack --silent | tail -1)" >> "$GITHUB_OUTPUT"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            --verify-tag \
            "${{ steps.pack.outputs.tgz }}"